{% extends "base.html" %}
{% block title %}Login — RobuxShop{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Login</h1>
  <form method="POST">
    <label>Email</label>
    <input type="text" name="email" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit" class="btn full">Login</button>
  </form>
  <p class="auth-footer">No account? <a href="{{ url_for('register') }}">Sign Up</a></p>
</div>
{% endblock %}
